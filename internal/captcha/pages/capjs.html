<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cap</title>
    <script>
      window.CAP_CUSTOM_WASM_URL = '{{.api_endpoint}}/assets/cap_wasm_bg.wasm'
      window.CAP_CUSTOM_HASHWX_URL = '{{.api_endpoint}}/assets/hashwx.wasm'
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
      }
      #error:empty {
        display: none;
      }
      #error {
        margin: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <cap-widget
      data-cap-api-endpoint="{{.api_endpoint}}/{{.key_id}}/"
      data-cap-i18n-initial-state="点击验证ヾ(•ω•`)o"
      data-cap-i18n-verifying-label="验证中..."
      data-cap-i18n-solved-label="验证通过，等待后端处理..."
      data-cap-i18n-error-label="发生错误，请重试 ＞﹏＜"
      data-cap-i18n-required-label="请验证您是人类"
    ></cap-widget>
    <p id="error" role="alert"></p>
    <script>
      const widget = document.querySelector('cap-widget')
      const error = document.getElementById('error')
      widget.addEventListener('solve', async (event) => {
        error.textContent = ''
        try {
          const response = await fetch(location.pathname.replace(/\/?$/, '/verify'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ value: event.detail.token }),
          })
          if (!response.ok) throw new Error('Verification failed. Please try again.')
          window.parent.postMessage({ type: 'captcha-solved' }, '*')
        } catch {
          error.textContent = '验证失败，请重试'
          widget.reset()
        }
      })
      widget.addEventListener('error', () => {
        error.textContent = '验证码加载失败，请重试'
      })
    </script>
    <script
      src="{{.api_endpoint}}/assets/widget.js"
      onerror="
        document.getElementById('error').textContent =
          '验证码加载失败，请重试'
      "
    ></script>
  </body>
</html>
